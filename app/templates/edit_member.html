{% extends "base.html" %}
{% block title %}Edit {{ member.full_name }} — IronCore GMS{% endblock %}
{% block page_title %}Edit Member{% endblock %}

{% block content %}
<div class="form-page">
  <div class="card form-card">
    <div class="card-header">
      <span class="card-title">EDIT MEMBER — {{ member.full_name.upper() }}</span>
    </div>
    <form method="POST">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">FULL NAME *</label>
          <input class="form-input" type="text" name="full_name" value="{{ member.full_name }}" required>
        </div>
        <div class="form-group">
          <label class="form-label">EMAIL *</label>
          <input class="form-input" type="email" name="email" value="{{ member.email }}" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">PHONE</label>
          <input class="form-input" type="tel" name="phone" value="{{ member.phone or '' }}">
        </div>
        <div class="form-group">
          <label class="form-label">MEMBERSHIP PLAN</label>
          <select class="form-input" name="plan_id">
            {% for p in plans %}
            <option value="{{ p.id }}" {% if p.id == member.plan_id %}selected{% endif %}>
              {{ p.name }} — ${{ p.price }}
            </option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">STATUS</label>
          <select class="form-input" name="status">
            <option value="active"   {% if member.status=='active' %}selected{% endif %}>Active</option>
            <option value="inactive" {% if member.status=='inactive' %}selected{% endif %}>Inactive</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">EXPIRY DATE</label>
          <input class="form-input" type="date" name="expiry_date" value="{{ member.expiry_date }}" required>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">NOTES</label>
        <textarea class="form-input" name="notes" rows="3">{{ member.notes or '' }}</textarea>
      </div>
      <div class="form-actions">
        <a href="{{ url_for('member_detail', member_id=member.id) }}" class="btn btn-ghost">Cancel</a>
        <button type="submit" class="btn btn-primary">Save Changes</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
