<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IronCore GMS — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body">

<div class="login-bg">
  <div class="login-grid"></div>
</div>

<div class="login-container">
  <div class="login-brand">
    <div class="login-logo">⚡</div>
    <h1 class="login-title">IRONCORE</h1>
    <p class="login-subtitle">GYM MANAGEMENT SYSTEM</p>
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="flash flash-{{ category }}" style="margin-bottom:1rem">
          <span>{{ message }}</span>
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <form class="login-form" method="POST">
    <div class="form-group">
      <label class="form-label">USERNAME</label>
      <input class="form-input" type="text" name="username" placeholder="Enter username" required autofocus>
    </div>
    <div class="form-group">
      <label class="form-label">PASSWORD</label>
      <input class="form-input" type="password" name="password" placeholder="••••••••" required>
    </div>
    <button class="btn btn-primary btn-full" type="submit">ACCESS SYSTEM</button>
  </form>

  <p class="login-hint">Default: admin / admin123</p>
</div>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
